# Puts a new dev joke in the profile README every morning.
name: Joke of the day

on:
  schedule:
    - cron: '0 12 * * *'   # 8 a.m. New York time (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  joke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick today's joke
        run: python scripts/joke_of_the_day.py
      - name: Commit if it changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Joke of the day"
          git push
